# Phase 1: Loss Weight Rebalance + PQ Early Stop (L4)
# Based on: bf_instance_p2_20260205.yaml
# Changes: boundary 0.5->1.5, contour 0.1->0.3, PQ early stop ON
# Reference: docs/codex_claude_seg.md chapter 12

data:
  splits_dir: "data/splits"
  raw_data_dir: "data/raw/allen_segmented_fields_full"
  processed_data_dir: "data/processed"
  target_size: [1024, 1024]
  max_boxes_per_image: 30
  use_bf_only: true
  use_semantic_mapping: false

model:
  checkpoint: null
  freeze_encoder: true
  freeze_decoder: false
  use_adapter: false

training:
  epochs: 50
  batch_size: 4
  learning_rate: 0.0001
  weight_decay: 0.0001
  warmup_epochs: 5
  early_stop_patience: 15
  use_pq_early_stop: true       # Changed: false -> true

loss:
  type: "combined"
  pos_weight: 2.0                # Changed: 10.0 -> 2.0
  boundary_weight: 1.5           # Changed: 0.5 -> 1.5
  use_boundary: true
  use_aji: true
  aji_weight: 0.2
  box_expand: 0.1
  # Phase 1 isolates boundary/contour + PQ early stop.
  # Topology/size disabled for clean ablation (enable in Phase 2).
  use_topology: false
  topology_weight: 0.1
  use_size: false
  size_weight: 0.1
  use_contour: true
  contour_weight: 0.3            # Changed: 0.1 -> 0.3

optimizer:
  type: "adamw"
  scheduler: "cosine_warmup"

output:
  checkpoint_dir: "checkpoints"
  save_every: 5
  keep_last_checkpoints: 3          # Keep only last 3 periodic saves (~3.3GB)
  experiment_name: "E_phase1_rebalance_l4"
