# =============================================================================
# BF Instance P1 Test - Quick validation of Best-Match dice
# =============================================================================
# Purpose: Test that Best-Match validation dice works correctly
# Data: 10% subset, 2 epochs only
# -----------------------------------------------------------------------------

data:
  splits_dir: "data/splits"
  raw_data_dir: "data/raw/allen_segmented_fields_full"
  processed_data_dir: "data/processed"
  target_size: [1024, 1024]
  max_boxes_per_image: 30
  use_bf_only: true
  use_semantic_mapping: false
  train_subset: 0.1  # 10% for quick test

model:
  checkpoint: null
  freeze_encoder: true
  freeze_decoder: false
  use_adapter: false

training:
  epochs: 2  # Quick test
  batch_size: 2
  learning_rate: 0.0001
  weight_decay: 0.0001
  warmup_epochs: 1
  early_stop_patience: 100  # No early stop for test
  use_pq_early_stop: false

loss:
  type: "combined"
  pos_weight: 2.0  # Reduced from 10.0
  boundary_weight: 0.5
  use_boundary: true
  use_aji: true
  aji_weight: 0.2
  box_expand: 0.1
  use_topology: false
  use_size: false
  use_contour: false

optimizer:
  type: "adamw"
  scheduler: "cosine_warmup"

output:
  checkpoint_dir: "checkpoints"
  save_every: 1
  experiment_name: "E33_test_bestmatch"
