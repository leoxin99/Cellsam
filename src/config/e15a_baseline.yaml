# E15a Baseline: BF-only training
# Uses only Brightfield channel (replicated 3x) for comparison with E15b

data:
  splits_dir: "data/splits"
  raw_data_dir: "data/raw/allen_segmented_fields_full"
  processed_data_dir: "data/processed"
  target_size: [1024, 1024]
  max_boxes_per_image: 50
  use_bf_only: true  # KEY: Only use BF channel

model:
  checkpoint: null
  freeze_encoder: true
  freeze_decoder: false

training:
  epochs: 30
  batch_size: 2
  learning_rate: 0.0001
  weight_decay: 0.0001
  warmup_epochs: 5

loss:
  type: "combined"
  pos_weight: 10.0
  boundary_weight: 0.3
  use_boundary: true

optimizer:
  type: "adamw"
  scheduler: "cosine_warmup"

output:
  checkpoint_dir: "checkpoints"
  save_every: 5
  experiment_name: "e15a_bf_baseline"
