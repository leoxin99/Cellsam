# BF + Adapter - 单通道 + Adapter 消融实验
# 目的: 验证 Adapter 模块在 BF 单通道条件下的效果
# 对比: bf_baseline_v2 (无 Adapter)
# Usage: python src/train.py --config src/config/bf_adapter.yaml

data:
  splits_dir: "data/splits"
  raw_data_dir: "data/raw/allen_segmented_fields_full"
  processed_data_dir: "data/processed"
  target_size: [1024, 1024]
  max_boxes_per_image: 50
  use_bf_only: true           # BF 单通道
  use_semantic_mapping: false # 不使用语义映射

model:
  checkpoint: null
  freeze_encoder: true
  freeze_decoder: false
  use_adapter: true           # 启用 Adapter
  adapter:
    type: "independent"       # 独立通道 Adapter
    kernel_size: 3
    use_relu: true

training:
  epochs: 100
  batch_size: 4
  learning_rate: 0.0001
  weight_decay: 0.0001
  warmup_epochs: 5

loss:
  type: "combined"
  pos_weight: 10.0
  boundary_weight: 0.3
  use_boundary: true
  box_expand: 0.1             # 与 bf_baseline_v2 一致

optimizer:
  type: "adamw"
  scheduler: "cosine_warmup"

output:
  checkpoint_dir: "checkpoints"
  save_every: 5
  experiment_name: "bf_adapter"
