# T11 LoRA Encoder Fine-tuning — rank=8
# Base: best_config.yaml
# Key change: use_lora=true, lora_rank=8
# Checkpoint: Best Config PQ=0.484 (pre-trained decoder)

data:
  splits_dir: "data/splits"
  raw_data_dir: "data/raw/allen_segmented_fields_full"
  processed_data_dir: "data/processed"
  target_size: [1024, 1024]
  max_boxes_per_image: 30
  use_bf_only: true
  use_semantic_mapping: false

model:
  # NOTE: relative path works because SLURM scripts cd ~/CellSam before training
  # Equivalent absolute path on ALICE: ~/CellSam/checkpoints/BestConfig_posw10_noCont_20260224_052553/best_model.pt
  checkpoint: "checkpoints/BestConfig_posw10_noCont_20260224_052553/best_model.pt"
  freeze_encoder: true    # Base encoder frozen; LoRA params are trainable (P1-1 order)
  freeze_decoder: false
  use_adapter: false
  use_lora: true           # NEW: enable LoRA
  lora_rank: 8             # rank=8 → ~295K params (0.33% of encoder)

training:
  epochs: 80
  batch_size: 2         # Reduced from 4: LoRA encoder gradients need more VRAM
  learning_rate: 0.0001
  weight_decay: 0.0001
  warmup_epochs: 5
  early_stop_patience: 15
  use_pq_early_stop: true
  seed: 42                # Overridden by CLI --seed

loss:
  type: "combined"
  pos_weight: 10.0
  boundary_weight: 1.5
  use_boundary: true
  use_aji: true
  aji_weight: 0.2
  box_expand: 0.1
  use_topology: false
  topology_weight: 0.1
  use_size: false
  size_weight: 0.1
  use_contour: false
  contour_weight: 0.0

optimizer:
  type: "adamw"
  scheduler: "cosine_warmup"

output:
  checkpoint_dir: "checkpoints"
  save_every: 5
  keep_last_checkpoints: 3
  experiment_name: "T11_LoRA_r8"
