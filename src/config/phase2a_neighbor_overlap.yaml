# =============================================================================
# Phase 2-A: L_neighbor + L_overlap (Created 2026-02-12)
# =============================================================================
# Purpose: Test neighbor intrusion + overlap mutex losses on top of Phase 1 baseline.
# Base: phase1_rebalance_l4.yaml (frozen, proven PQ=0.4641)
# Delta: +L_neighbor(0.3) +L_overlap(0.1), Topology/Size OFF (see codex_claude_seg.md Ch17)
# Reference: docs/phase2_design.md, docs/codex_claude_seg.md Ch17
# -----------------------------------------------------------------------------

data:
  splits_dir: "data/splits"
  raw_data_dir: "data/raw/allen_segmented_fields_full"
  processed_data_dir: "data/processed"
  target_size: [1024, 1024]
  max_boxes_per_image: 30
  use_bf_only: true
  use_semantic_mapping: false

model:
  # P2A-fix1: Load P1 best instead of CellSAM base (phase2_design.md §7.5)
  # Source: P1 L4 Job 974531, PQ=0.4750, Dice=0.6927
  checkpoint: "checkpoints/E_phase1_rebalance_l4_20260210_223531/best_model.pt"
  freeze_encoder: true
  freeze_decoder: false
  use_adapter: false

training:
  epochs: 50
  batch_size: 4
  learning_rate: 0.0001
  weight_decay: 0.0001
  warmup_epochs: 5
  early_stop_patience: 15
  use_pq_early_stop: true

loss:
  type: "combined"
  pos_weight: 2.0                # Same as Phase 1
  boundary_weight: 1.5           # Same as Phase 1
  use_boundary: true
  use_aji: true
  aji_weight: 0.2
  box_expand: 0.1
  # Phase 1 losses (keep proven config)
  use_topology: false             # OFF: cell thin-structure risk (Ch17.1)
  topology_weight: 0.1
  use_size: false                 # OFF: low priority + data leak (Ch17.2)
  size_weight: 0.1
  use_contour: true
  contour_weight: 0.3            # Same as Phase 1
  # Phase 2 Step 3: NEW - neighbor intrusion + overlap mutex
  use_neighbor: true
  neighbor_weight: 0.1           # Fix2: Reduced 0.3 -> 0.1 to avoid segmentation collapse
  neighbor_gamma: 1.5            # Focusing param (Codex suggested 2.0, Claude 1.5)
  use_overlap: true
  overlap_weight: 0.05           # Fix2: Reduced 0.1 -> 0.05
  overlap_margin: 0.05           # 5% overlap tolerance
  # Fix3: Delayed loss enable — first delay_epochs use pure P1 losses,
  # then linear ramp N/O over ramp_epochs (phase2_design.md §8.4)
  delay_epochs: 10
  ramp_epochs: 10

optimizer:
  type: "adamw"
  scheduler: "cosine_warmup"

output:
  checkpoint_dir: "checkpoints"
  save_every: 5
  keep_last_checkpoints: 3
  experiment_name: "E_phase2a_fix3_delayed"
