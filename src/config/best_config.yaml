# Best Config: Combines T12 ablation high-confidence findings
# Based on: phase1_rebalance_l4.yaml
# Changes: pos_weight 2.0 -> 10.0 (Ab-5: +4.10pp PQ)
#          contour OFF (Ab-2: +2.33pp PQ)
# Expected: PQ ≈ 0.50+ (论文新 SOTA)

data:
  splits_dir: "data/splits"
  raw_data_dir: "data/raw/allen_segmented_fields_full"
  processed_data_dir: "data/processed"
  target_size: [1024, 1024]
  max_boxes_per_image: 30
  use_bf_only: true
  use_semantic_mapping: false

model:
  checkpoint: null
  freeze_encoder: true
  freeze_decoder: false
  use_adapter: false

training:
  epochs: 50
  batch_size: 4
  learning_rate: 0.0001
  weight_decay: 0.0001
  warmup_epochs: 5
  early_stop_patience: 15
  use_pq_early_stop: true
  seed: 42

loss:
  type: "combined"
  pos_weight: 10.0               # KEY CHANGE: 2.0 -> 10.0 (Ab-5 finding)
  boundary_weight: 1.5
  use_boundary: true
  use_aji: true
  aji_weight: 0.2
  box_expand: 0.1
  use_topology: false
  topology_weight: 0.1
  use_size: false
  size_weight: 0.1
  use_contour: false              # KEY CHANGE: true -> false (Ab-2 finding)
  contour_weight: 0.0

optimizer:
  type: "adamw"
  scheduler: "cosine_warmup"

output:
  checkpoint_dir: "checkpoints"
  save_every: 5
  keep_last_checkpoints: 3
  experiment_name: "BestConfig_posw10_noCont"
