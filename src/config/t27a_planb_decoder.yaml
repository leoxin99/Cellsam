# T27a: Plan B Decoder-Only Fine-Tuning (Clean Baseline)
#
# Key changes vs Best Config:
#   1. Uses model_cp directly (not copy to model.model)
#   2. Official preprocessing (prep_2 + forward)
#   3. Postprocess = official 7-step morphological smoothing
#   4. Prompt encoder frozen
#   5. model + cellfinder branches frozen
#   6. Focal Loss + IoU Head Loss added
#
# Expected: PQ >= 0.434 (model_cp pretrained baseline) -> target 0.50+

data:
  splits_dir: "data/splits"
  raw_data_dir: "data/raw/allen_segmented_fields_full"
  processed_data_dir: "data/processed"
  target_size: [1024, 1024]
  max_boxes_per_image: 30
  use_bf_only: true
  use_semantic_mapping: false

model:
  checkpoint: null
  freeze_encoder: true
  freeze_decoder: false
  use_adapter: false
  use_lora: false

training:
  epochs: 80
  batch_size: 4
  learning_rate: 0.0001
  weight_decay: 0.0001
  warmup_epochs: 5
  early_stop_patience: 15
  use_pq_early_stop: true
  seed: 42
  iou_weight: 0.1           # IoU Head Loss weight (explicit)

loss:
  type: "combined"
  pos_weight: 10.0
  boundary_weight: 0.3             # Reduced from 1.5 (was 65% of total, now balanced ~27%)
  use_boundary: true
  use_aji: true
  aji_weight: 0.2
  box_expand: 0.1
  use_topology: false
  topology_weight: 0.1
  use_size: false
  size_weight: 0.1
  use_contour: false
  contour_weight: 0.0
  # Focal Loss (Plan B addition)
  use_focal: true
  focal_weight: 0.3
  focal_alpha: 0.25
  focal_gamma: 2.0

optimizer:
  type: "adamw"
  scheduler: "cosine_warmup"

output:
  checkpoint_dir: "checkpoints"
  save_every: 5
  keep_last_checkpoints: 3
  experiment_name: "T27a_PlanB_DecoderOnly"
