# =============================================================================
# BF Instance Phase 2 - Full Training (Created 2026-02-05)
# =============================================================================
# Purpose: Full training with all losses enabled
# Data: 100% training data, 100 epochs
# Losses: Dice, BCE, Boundary, AJI + Topology, Size, Contour
# Augmentation: All including GridDistortion
# Box: GT boxes (training), DAPI boxes (inference)
# -----------------------------------------------------------------------------

data:
  splits_dir: "data/splits"
  raw_data_dir: "data/raw/allen_segmented_fields_full"
  processed_data_dir: "data/processed"
  target_size: [1024, 1024]
  max_boxes_per_image: 30  # Cardiomyocytes: ~15-20 cells/image
  use_bf_only: true
  use_semantic_mapping: false

model:
  checkpoint: null
  freeze_encoder: true
  freeze_decoder: false
  use_adapter: false

training:
  epochs: 100
  batch_size: 4
  learning_rate: 0.0001
  weight_decay: 0.0001
  warmup_epochs: 5
  early_stop_patience: 15
  use_pq_early_stop: false

loss:
  type: "combined"
  pos_weight: 10.0
  boundary_weight: 0.5
  use_boundary: true
  use_aji: true
  aji_weight: 0.2
  box_expand: 0.1
  # Phase 2: All losses enabled
  use_topology: true
  topology_weight: 0.1
  use_size: true
  size_weight: 0.1
  use_contour: true
  contour_weight: 0.1

optimizer:
  type: "adamw"
  scheduler: "cosine_warmup"

output:
  checkpoint_dir: "checkpoints"
  save_every: 5
  experiment_name: "E31_bf_instance_p2_20260205"
