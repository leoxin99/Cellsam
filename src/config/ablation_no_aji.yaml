# Ab-3: w/o AJI Loss
# 仅关闭 AJI, 保留 Boundary + Contour + PQ early stop
# Purpose: 量化 AJI Loss (w=0.2) 对实例分离的贡献

data:
  splits_dir: "data/splits"
  raw_data_dir: "data/raw/allen_segmented_fields_full"
  processed_data_dir: "data/processed"
  target_size: [1024, 1024]
  max_boxes_per_image: 30
  use_bf_only: true
  use_semantic_mapping: false

model:
  checkpoint: null
  freeze_encoder: true
  freeze_decoder: false
  use_adapter: false

training:
  epochs: 50
  batch_size: 4
  learning_rate: 0.0001
  weight_decay: 0.0001
  warmup_epochs: 5
  early_stop_patience: 15
  use_pq_early_stop: true
  seed: 42

loss:
  type: "combined"
  pos_weight: 2.0
  boundary_weight: 1.5
  use_boundary: true
  use_aji: false                    # ← ABLATED
  aji_weight: 0.0
  box_expand: 0.1
  use_topology: false
  topology_weight: 0.1
  use_size: false
  size_weight: 0.1
  use_contour: true
  contour_weight: 0.3

optimizer:
  type: "adamw"
  scheduler: "cosine_warmup"

output:
  checkpoint_dir: "checkpoints"
  save_every: 5
  keep_last_checkpoints: 3
  experiment_name: "Ab3_no_aji"
