# T18-Control: BF×3 Continue-Training from Best Config
# Purpose: Critical control — identical to T18 setup but WITHOUT multi-channel
# If PQ ≈ T18 levels (~0.495) → T18 improvement is from extra training, not channels
# If PQ ≈ Best Config (~0.484) → T18 improvement IS from multi-channel info
#
# Key: Same checkpoint, same lr (5e-5), same epochs (80), same patience — only BF×3

data:
  splits_dir: "data/splits"
  raw_data_dir: "data/raw/allen_segmented_fields_full"
  processed_data_dir: "data/processed"
  target_size: [1024, 1024]
  max_boxes_per_image: 30
  use_bf_only: true               # KEY: BF-only, NOT multi-channel
  use_semantic_mapping: false

model:
  checkpoint: "checkpoints/BestConfig_posw10_noCont_20260224_052553/best_model.pt"
  freeze_encoder: true
  freeze_decoder: false
  use_adapter: false

training:
  epochs: 80
  batch_size: 4
  learning_rate: 0.00005           # KEY: 5e-5, same as T18 (NOT 1e-4 from original)
  weight_decay: 0.0001
  warmup_epochs: 5
  early_stop_patience: 15
  use_pq_early_stop: true

loss:
  type: "combined"
  pos_weight: 10.0
  boundary_weight: 1.5
  use_boundary: true
  use_aji: true
  aji_weight: 0.2
  box_expand: 0.1
  use_topology: false
  topology_weight: 0.1
  use_size: false
  size_weight: 0.1
  use_contour: false
  contour_weight: 0.0

optimizer:
  type: "adamw"
  scheduler: "cosine_warmup"

output:
  checkpoint_dir: "checkpoints"
  save_every: 5
  keep_last_checkpoints: 3
  experiment_name: "T18_Control_BF_ContinueTrain"
