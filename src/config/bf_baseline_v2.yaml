# BF Baseline v2 - 修复后的基线模型
# 主要修改: box_expand 0.2 → 0.1, uint8 bug 已修复

experiment_name: "bf_baseline_v2"

model:
  type: "cellsam"
  use_bf_only: true
  use_semantic_mapping: false
  use_adapter: false
  pretrained_path: "cellSAM_source/sam_vit_b_01ec64.pth"

data:
  data_dir: "data/processed"
  train_split: "data/splits/train_ids.txt"
  val_split: "data/splits/val_ids.txt"
  batch_size: 4
  num_workers: 4

loss:
  dice_weight: 1.0
  boundary_weight: 0.3
  box_expand: 0.1

training:
  epochs: 100
  learning_rate: 0.0001
  weight_decay: 0.0001
  early_stopping_patience: 15
  scheduler: "cosine"
  warmup_epochs: 5

output:
  checkpoint_dir: "checkpoints"
  save_best: "bf_baseline_v2_best.pt"
  save_last: "bf_baseline_v2_last.pt"
  log_interval: 10
