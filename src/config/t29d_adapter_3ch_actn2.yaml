# T29d: 3ch Official Encoding + Actn2 + IndependentChannelAdapter (seed=42)
#
# Ablation: Does adapter help on model_cp (Phase 2)?
# Baseline = T29c (no adapter, PQ=0.682 val mean)
# This run adds IndependentChannelAdapter (~30 params, identity-init)
# Channel order: R=Actn2, G=DAPI, B=BF

data:
  splits_dir: "data/splits"
  raw_data_dir: "data/raw/allen_segmented_fields_full"
  processed_data_dir: "data/processed"
  target_size: [1024, 1024]
  max_boxes_per_image: 30
  use_bf_only: false
  use_semantic_mapping: true
  use_official_encoding: true   # R=Actn2, G=DAPI, B=BF
  official_r_channel: actn2

model:
  checkpoint: null
  freeze_encoder: true
  freeze_decoder: false
  use_adapter: true
  adapter:
    type: independent
    kernel_size: 3
    use_relu: false
  use_lora: false

training:
  epochs: 80
  batch_size: 4
  learning_rate: 0.0001
  weight_decay: 0.0001
  warmup_epochs: 5
  early_stop_patience: 15
  use_pq_early_stop: true
  seed: 42
  iou_weight: 0.1

loss:
  type: "combined"
  pos_weight: 10.0
  boundary_weight: 0.3
  use_boundary: true
  use_aji: true
  aji_weight: 0.2
  box_expand: 0.1
  use_topology: false
  topology_weight: 0.1
  use_size: false
  size_weight: 0.1
  use_contour: false
  contour_weight: 0.0
  use_focal: true
  focal_weight: 0.3
  focal_alpha: 0.25
  focal_gamma: 2.0

optimizer:
  type: "adamw"
  scheduler: "cosine_warmup"

output:
  checkpoint_dir: "checkpoints"
  save_every: 5
  keep_last_checkpoints: 3
  experiment_name: "T29d_Adapter_3ch_Actn2"
