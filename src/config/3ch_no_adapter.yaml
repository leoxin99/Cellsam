# 3-Channel No Adapter - 多通道消融基线
# 直接使用 3 通道输入，不使用 Semantic Mapping 或 Adapter
# Usage: python src/train.py --config src/config/3ch_no_adapter.yaml

data:
  splits_dir: "data/splits"
  raw_data_dir: "data/raw/allen_segmented_fields_full"
  processed_data_dir: "data/processed"
  target_size: [1024, 1024]
  max_boxes_per_image: 50
  use_bf_only: false          # 使用全部 3 通道
  use_semantic_mapping: false  # 不使用语义映射

model:
  checkpoint: null
  freeze_encoder: true
  freeze_decoder: false
  use_adapter: false          # 不使用 Adapter

training:
  epochs: 100
  batch_size: 4
  learning_rate: 0.0001
  weight_decay: 0.0001
  warmup_epochs: 5

loss:
  type: "combined"
  pos_weight: 10.0
  boundary_weight: 0.3
  use_boundary: true
  box_expand: 0.1

optimizer:
  type: "adamw"
  scheduler: "cosine_warmup"

output:
  checkpoint_dir: "checkpoints"
  save_every: 5
  experiment_name: "3ch_no_adapter"
