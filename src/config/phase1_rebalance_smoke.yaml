# Phase 1 Smoke Train: 1-epoch verification
# Purpose: Verify training pipeline works end-to-end before full 50-epoch run
# Based on: phase1_rebalance.yaml (identical loss/model settings)

data:
  splits_dir: "data/splits"
  raw_data_dir: "data/raw/allen_segmented_fields_full"
  processed_data_dir: "data/processed"
  target_size: [1024, 1024]
  max_boxes_per_image: 30
  use_bf_only: true
  use_semantic_mapping: false

model:
  checkpoint: null
  freeze_encoder: true
  freeze_decoder: false
  use_adapter: false

training:
  epochs: 1                        # Smoke: 1 epoch only
  batch_size: 4
  learning_rate: 0.0001
  weight_decay: 0.0001
  warmup_epochs: 1                 # Must be ≥1 (used as T_0 in CosineAnnealingWarmRestarts)
  early_stop_patience: 1           # Smoke: minimal
  use_pq_early_stop: true

loss:
  type: "combined"
  pos_weight: 2.0
  boundary_weight: 1.5
  use_boundary: true
  use_aji: true
  aji_weight: 0.2
  box_expand: 0.1
  # Same as phase1_rebalance: topology/size OFF for clean ablation
  use_topology: false
  topology_weight: 0.1
  use_size: false
  size_weight: 0.1
  use_contour: true
  contour_weight: 0.3

optimizer:
  type: "adamw"
  scheduler: "cosine_warmup"

output:
  checkpoint_dir: "checkpoints"
  save_every: 1                    # Smoke: save every epoch
  experiment_name: "E_phase1_smoke_verify"
