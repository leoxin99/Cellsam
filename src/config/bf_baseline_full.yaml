# BF Baseline Configuration - Full Dataset Training
# For fair comparison with Semantic Adapter

data:
  max_boxes_per_image: 50
  processed_data_dir: data/processed
  raw_data_dir: data/raw/allen_segmented_fields_full
  splits_dir: data/splits
  target_size:
  - 1024
  - 1024
  use_bf_only: true          # BF channel only (copied 3 times)
  use_semantic_mapping: false # No semantic channel mapping

loss:
  boundary_weight: 0.3
  pos_weight: 10.0
  type: combined
  use_boundary: true

model:
  adapter:
    kernel_size: 3
    type: independent
    use_relu: true
  checkpoint: null
  freeze_decoder: false
  freeze_encoder: true
  use_adapter: false         # No adapter

optimizer:
  scheduler: cosine_warmup
  type: adamw

output:
  checkpoint_dir: checkpoints
  experiment_name: bf_baseline_full
  save_every: 5

training:
  batch_size: 2
  epochs: 30
  learning_rate: 1.0e-05
  warmup_epochs: 3
  weight_decay: 0.0001
