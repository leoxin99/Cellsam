# Boundary loss fine-tuning configuration
# Usage: python src/train.py --config src/config/boundary.yaml

data:
  splits_dir: "data/splits"
  raw_data_dir: "data/raw/allen_segmented_fields_full"
  processed_data_dir: "training_pairs_expanded"
  target_size: [1024, 1024]
  max_boxes_per_image: 50

model:
  checkpoint: "checkpoints/expanded_20260108_034352/best_model.pt"
  freeze_encoder: true
  freeze_decoder: false

training:
  epochs: 20
  batch_size: 2
  learning_rate: 0.00001  # Lower LR for fine-tuning
  weight_decay: 0.0001
  warmup_epochs: 3

loss:
  type: "combined"
  pos_weight: 10.0
  boundary_weight: 0.5  # Higher boundary weight for fine-tuning
  use_boundary: true

optimizer:
  type: "adamw"
  scheduler: "cosine_warmup"

output:
  checkpoint_dir: "checkpoints"
  save_every: 5
  experiment_name: "boundary_finetune"
