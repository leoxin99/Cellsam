# T18-A: 2-Channel (BF + Actn2) with Adapter
# Fine-tunes from Best Config checkpoint
# Channels: R=BF, G=Actn2, B=BF(copy)  — 2ch mode
# Based on R1 review [2026-02-24 16:43]

data:
  splits_dir: "data/splits"
  raw_data_dir: "data/raw/allen_segmented_fields_full"
  processed_data_dir: "data/processed"
  target_size: [1024, 1024]
  max_boxes_per_image: 30
  use_bf_only: false
  use_semantic_mapping: true
  use_2ch: true                    # 2ch mode: B channel = BF copy

model:
  checkpoint: "checkpoints/BestConfig_posw10_noCont_20260224_052553/best_model.pt"
  freeze_encoder: true
  freeze_decoder: false
  use_adapter: true
  adapter:
    type: "independent"
    kernel_size: 3
    use_relu: true

training:
  epochs: 80
  batch_size: 4
  learning_rate: 0.00005           # Fine-tune lr (R1: conservative first)
  weight_decay: 0.0001
  warmup_epochs: 5
  early_stop_patience: 15
  use_pq_early_stop: true

loss:
  type: "combined"
  pos_weight: 10.0                 # Best Config finding
  boundary_weight: 1.5
  use_boundary: true
  use_aji: true
  aji_weight: 0.2
  box_expand: 0.1
  use_topology: false
  topology_weight: 0.1
  use_size: false
  size_weight: 0.1
  use_contour: false               # Best Config finding
  contour_weight: 0.0

optimizer:
  type: "adamw"
  scheduler: "cosine_warmup"

output:
  checkpoint_dir: "checkpoints"
  save_every: 5
  keep_last_checkpoints: 3
  experiment_name: "T18A_2ch_BF_Actn2"
