# BF Instance v1 - Instance-level training with box clipping
# Key changes from previous experiments:
# - Instance-level target (specific cell, not entire mask)
# - Box clipping for both pred and target
# - Instance Dice for validation

data:
  splits_dir: "data/splits"
  raw_data_dir: "data/raw/allen_segmented_fields_full"
  processed_data_dir: "data/processed"
  target_size: [1024, 1024]
  max_boxes_per_image: 50
  use_bf_only: true
  use_semantic_mapping: false

model:
  checkpoint: null
  freeze_encoder: true
  freeze_decoder: false
  use_adapter: false

training:
  epochs: 100
  batch_size: 4
  learning_rate: 0.0001
  weight_decay: 0.0001
  warmup_epochs: 5
  early_stop_patience: 15
  use_pq_early_stop: false  # Use Instance Dice for early stopping

loss:
  type: "combined"
  pos_weight: 10.0
  boundary_weight: 0.5
  use_boundary: true
  use_aji: true
  box_expand: 0.1  # Constrain predictions to box region

optimizer:
  type: "adamw"
  scheduler: "cosine_warmup"

output:
  checkpoint_dir: "checkpoints"
  save_every: 5
  experiment_name: "bf_instance_v1"
