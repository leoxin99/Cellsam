# Phase 1: Loss Weight Rebalance + PQ Early Stop — WITH Adapter
# Purpose: Fair comparison of "adapter vs no-adapter" under identical loss config
# Based on: phase1_rebalance.yaml (identical loss/training settings)
# Only difference: use_adapter=true + 3-channel semantic input
# Reference: docs/codex_claude_seg.md chapter 12

data:
  splits_dir: "data/splits"
  raw_data_dir: "data/raw/allen_segmented_fields_full"
  processed_data_dir: "data/processed"
  target_size: [1024, 1024]
  max_boxes_per_image: 30
  use_bf_only: false                # 3-channel (BF + DAPI + semantic)
  use_semantic_mapping: true        # Enable semantic channel mapping

model:
  checkpoint: null
  freeze_encoder: true
  freeze_decoder: false
  use_adapter: true                 # ← Key difference: adapter ON
  adapter:
    type: "independent"
    kernel_size: 3
    use_relu: true

training:
  epochs: 50
  batch_size: 4
  learning_rate: 0.0001
  weight_decay: 0.0001
  warmup_epochs: 5
  early_stop_patience: 15
  use_pq_early_stop: true           # Same as Phase 1 main line

loss:
  type: "combined"
  pos_weight: 2.0                   # Same as Phase 1 main line
  boundary_weight: 1.5              # Same as Phase 1 main line
  use_boundary: true
  use_aji: true
  aji_weight: 0.2
  box_expand: 0.1
  # Same as Phase 1: topology/size OFF for clean ablation
  use_topology: false
  topology_weight: 0.1
  use_size: false
  size_weight: 0.1
  use_contour: true
  contour_weight: 0.3               # Same as Phase 1 main line

optimizer:
  type: "adamw"
  scheduler: "cosine_warmup"

output:
  checkpoint_dir: "checkpoints"
  save_every: 5
  keep_last_checkpoints: 3
  experiment_name: "E_phase1_adapter"
