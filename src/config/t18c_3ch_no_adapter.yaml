# T18-C: 3-Channel (BF + DAPI + Actn2) WITHOUT Adapter
# Fine-tunes from Best Config checkpoint
# Channels: R=BF, G=Actn2, B=DAPI — full 3ch, NO adapter
# Purpose: Isolate adapter contribution (compare T18-B vs T18-C)
# Only 1 run needed (seed=42, L4)

data:
  splits_dir: "data/splits"
  raw_data_dir: "data/raw/allen_segmented_fields_full"
  processed_data_dir: "data/processed"
  target_size: [1024, 1024]
  max_boxes_per_image: 30
  use_bf_only: false
  use_semantic_mapping: true
  use_2ch: false                   # Full 3ch

model:
  checkpoint: "checkpoints/BestConfig_posw10_noCont_20260224_052553/best_model.pt"
  freeze_encoder: true
  freeze_decoder: false
  use_adapter: false               # KEY: NO adapter — raw 3ch input
  
training:
  epochs: 80
  batch_size: 4
  learning_rate: 0.00005
  weight_decay: 0.0001
  warmup_epochs: 5
  early_stop_patience: 15
  use_pq_early_stop: true

loss:
  type: "combined"
  pos_weight: 10.0
  boundary_weight: 1.5
  use_boundary: true
  use_aji: true
  aji_weight: 0.2
  box_expand: 0.1
  use_topology: false
  topology_weight: 0.1
  use_size: false
  size_weight: 0.1
  use_contour: false
  contour_weight: 0.0

optimizer:
  type: "adamw"
  scheduler: "cosine_warmup"

output:
  checkpoint_dir: "checkpoints"
  save_every: 5
  keep_last_checkpoints: 3
  experiment_name: "T18C_3ch_noAdapter"
