# Ab-5: pos_weight=10.0 (恢复 Phase 0 原始值)
# 将 pos_weight 从 2.0 恢复到 10.0
# Purpose: 量化 pos_weight 降低 (10→2) 对正负样本平衡的影响

data:
  splits_dir: "data/splits"
  raw_data_dir: "data/raw/allen_segmented_fields_full"
  processed_data_dir: "data/processed"
  target_size: [1024, 1024]
  max_boxes_per_image: 30
  use_bf_only: true
  use_semantic_mapping: false

model:
  checkpoint: null
  freeze_encoder: true
  freeze_decoder: false
  use_adapter: false

training:
  epochs: 50
  batch_size: 4
  learning_rate: 0.0001
  weight_decay: 0.0001
  warmup_epochs: 5
  early_stop_patience: 15
  use_pq_early_stop: true
  seed: 42

loss:
  type: "combined"
  pos_weight: 10.0                  # ← ABLATED (原始值)
  boundary_weight: 1.5
  use_boundary: true
  use_aji: true
  aji_weight: 0.2
  box_expand: 0.1
  use_topology: false
  topology_weight: 0.1
  use_size: false
  size_weight: 0.1
  use_contour: true
  contour_weight: 0.3

optimizer:
  type: "adamw"
  scheduler: "cosine_warmup"

output:
  checkpoint_dir: "checkpoints"
  save_every: 5
  keep_last_checkpoints: 3
  experiment_name: "Ab5_posw10"
