data:
  max_boxes_per_image: 30
  processed_data_dir: data/processed
  raw_data_dir: data/raw/allen_segmented_fields_full
  splits_dir: data/splits
  target_size:
  - 1024
  - 1024
  use_bf_only: true
  use_semantic_mapping: false
loss:
  aji_weight: 0.2
  boundary_weight: 1.5
  box_expand: 0.1
  contour_weight: 0.3
  pos_weight: 2.0
  size_weight: 0.1
  topology_weight: 0.1
  type: combined
  use_aji: true
  use_boundary: true
  use_contour: true
  use_size: false
  use_topology: false
model:
  checkpoint: null
  freeze_decoder: false
  freeze_encoder: true
  use_adapter: false
optimizer:
  scheduler: cosine_warmup
  type: adamw
output:
  checkpoint_dir: checkpoints
  experiment_name: E_phase1_rebalance_l4
  keep_last_checkpoints: 3
  save_every: 5
training:
  batch_size: 4
  early_stop_patience: 15
  epochs: 50
  learning_rate: 0.0001
  use_pq_early_stop: true
  warmup_epochs: 5
  weight_decay: 0.0001
